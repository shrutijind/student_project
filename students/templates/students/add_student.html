{% extends 'students/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h4 class="card-title mb-0">Add New Student Profile</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_user" class="form-label">Associated User Account <span class="text-danger">*</span></label>
                        {{ form.user }}
                    </div>

                    <div class="mb-3">
                        <label for="id_roll_number" class="form-label">Roll Number <span class="text-danger">*</span></label>
                        {{ form.roll_number }}
                    </div>

                    <div class="mb-3">
                        <label for="id_grade" class="form-label">Grade / Class <span class="text-danger">*</span></label>
                        {{ form.grade }}
                    </div>

                    <div class="mb-3">
                        <label for="id_attendance_status" class="form-label">Initial Attendance Status</label>
                        {{ form.attendance_status }}
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Create Student</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
